# fly launch --copy-config --no-deploy (from hub/), then:
#   fly volumes create hub_data --size 1
#   fly secrets set HUB_PUBLIC_URL=https://<your-app>.fly.dev
#   fly deploy
app = "aviator-hub"
primary_region = "ams"

[build]

[env]
  HUB_DATA_DIR = "/data"
  HUB_TRUST_PROXY = "1"
  PORT = "8080"

[[mounts]]
  source = "hub_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The hub holds each computer's connection open, so keep one machine running.
  auto_stop_machines = "off"
  min_machines_running = 1
